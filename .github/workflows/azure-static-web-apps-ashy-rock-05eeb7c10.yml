name: Deploy First-App to Azure SWA

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, closed ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # FORCE NODE 20
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # BUILD YOURSELF — BYPASS ORYX COMPLETELY
      - name: Build Angular
        run: |
          npm ci
          npm run build -- --configuration production

      # DEPLOY — NOTICE THE TWO LINES
      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ASHY_ROCK_05EEB7C10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: false          # ← FORCE BUILD OFF → ON
          app_location: "/"             
          app_artifact_location: "dist/First-App/browser"   # EXACT FOLDER
